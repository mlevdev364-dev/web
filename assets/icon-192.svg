<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAKA OMNI — Offline</title>
  <meta name="theme-color" content="#070B14" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      background: #070B14;
      color: #EDF1F7;
      font-family: Arial, sans-serif;
    }
    .card {
      max-width: 500px;
      padding: 32px;
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: #93A0B8; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SAKA OMNI</h1>
    <p>You are offline, but this page is cached and will be available when your connection returns.</p>
  </div>
</body>
</html>
